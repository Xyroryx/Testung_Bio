*,*::before,*::after{box-sizing:border-box}
body{

.srow[data-sp="pferd"]{--spc:var(--sp-pferd);--spc-bg:var(--sp-pferd-bg)}
.srow[data-sp="hund"]{--spc:var(--sp-hund);--spc-bg:var(--sp-hund-bg)}
.srow[data-sp="katze"]{--spc:var(--sp-katze);--spc-bg:var(--sp-katze-bg)}

.gb-p{background:var(--p-bg);color:var(--p-ink)}

.chev{flex:0 0 auto;width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(-45deg);transition:transform .15s;margin:0 4px 0 2px}

.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}

.name{font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.seg{display:flex;gap:4px}

.seg button[data-v="-"][aria-pressed="true"]{background:var(--m-fill);border-color:var(--m-fill);color:var(--m-on)}
.gacts{display:flex;gap:8px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 14px;min-height:44px;font:500 15px var(--font-body);color:var(--ink)}

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

function parse(sys,raw){
  var groups=[],g=null;
  raw.trim().split('\n').forEach(function(line){
    line=line.trim(); if(!line) return;

    }

async function flush(id){
  if(!store.ready||writing[id]){timers[id]=setTimeout(function(){flush(id)},400);return}
  var s=st.sessions[id]; if(!s){dirty.delete(id);return}
  dirty.delete(id);writing[id]=true;
  try{
    await store.save(s);
    if(!dirty.size) setSave('ok');
  }catch(e){
    dirty.add(id);setSave('err');
  }finally{
    writing[id]=false;
  }
}

function applyRemote(docs){
  var seen={};
  docs.forEach(function(d){
    var id=d.id;seen[id]=1;
    if(dirty.has(id)||writing[id]) return;
    var data=d.data()||{};
    st.sessions[id]=fromDoc(id,data);
  });
  Object.keys(st.sessions).forEach(function(id){
    var s=st.sessions[id];
    if(s.persisted&&!seen[id]&&!dirty.has(id)&&!writing[id]&&Date.now()-s.touchedAt>8000) delete st.sessions[id];
  });
  if(firstSync){
    firstSync=false;
    var c=cur();
    if(isPristine(c)){
      var want=LS.get('tb-current'),pick=null;
      if(want&&st.sessions[want]&&st.sessions[want].persisted) pick=want;
      else{var l=savedList();if(l.length) pick=l[0].id}
      if(pick){delete st.sessions[c.id];st.cur=pick}
    }
  }
  if(!cur()){
    var l2=savedList();
    if(l2.length) st.cur=l2[0].id; else st.cur=newSession().id;
  }
  var ae=document.activeElement;
  if(st.editing&&ae&&/^e-/.test(ae.id||'')){syncHeader();renderBar()} else renderAll();
}

function useLocal(){
  st.storage='local';
  function readAll(){try{return JSON.parse(LS.get('tb-sessions')||'{}')||{}}catch(e){return {}}}
  store.save=async function(s){
    var all=readAll();all[s.id]=payload(s);
    if(!LS.set('tb-sessions',JSON.stringify(all))) throw new Error('local');
  };
  store.remove=async function(id){var all=readAll();delete all[id];LS.set('tb-sessions',JSON.stringify(all))};
  store.ready=true;
  var all=readAll();
  applyRemote(Object.keys(all).map(function(id){return {id:id,data:function(){return all[id]}}}));
}

async function init(){
  var db=null,user=null;
  try{
    if(window.claude&&window.claude.use){
      db=await window.claude.use('db');
      user=await window.claude.use('user');
      st.dl=await window.claude.use('downloads');
    }
  }catch(e){}
  var id=null;
  try{if(db&&user) id=await user.id()}catch(e){}
  if(db&&id){
    st.storage='db';
    var col=db.collection('patients');
    store.save=function(s){return col.doc(s.id).set(payload(s))};
    store.remove=function(sid){return col.doc(sid).delete()};
    store.ready=true;
    col.onSnapshot(function(snap){applyRemote(snap.docs)},function(){
      if(st.storage==='db'){firstSync=false;useLocal()}
    });
    /* Einmalig: frühere private Einträge dieses Nutzers in die gemeinsame Liste übernehmen */
    try{
      var old=db.collection('data/users/'+id),snap0=await old.get();
      for(var i=0;i<snap0.docs.length;i++){
        var d0=snap0.docs[i];
        await col.doc(d0.id).set(d0.data());
        await old.doc(d0.id).delete();
      }
    }catch(e){}
  }else{
    useLocal();
  }
}

function rowHtml(it,v,ctx){
  var btns=['N','+','-'].map(function(x){
    return '<button type="button" data-code="'+it.code+'" data-v="'+x+'" aria-pressed="'+(hasF(v,x)?'true':'false')+'" aria-label="'+LBL[x]+'">'+SYM[x]+'</button>';
  }).join('');
  var cls='lbl'+(ctx?'':' lv'+Math.min(it.lvl||0,2))+(it.head?' hd':'');
  return '<div class="row" data-row="'+it.code+'" data-state="'+rowState(v)+'"><div class="'+cls+'"><span class="code">'+it.code+(ctx?' · '+esc(it.gname):'')+'</span><span class="name">'+esc(it.name)+'</span></div><div class="seg" role="group" aria-label="'+esc(it.code+' '+it.name)+'">'+btns+'</div></div>';
}
function groupRight(g,s){
  var t=stats(s,g.items),h='';
  if(t.pos) h+='<span class="gb gb-p">+'+t.pos+'</span>';
  if(t.neg) h+='<span class="gb gb-m">−'+t.neg+'</span>';
  if(t.bip) h+='<span class="gb gb-b">±'+t.bip+'</span>';
  return h+'<span class="gc">'+t.done+'/'+g.items.length+'</span>';
}
function groupHtml(g,items,s,open,acts){
  if(g.items.length===1){
    return '<div class="grp single">'+rowHtml(items[0],s.results[items[0].code],false)+'</div>';
  }
  var first=g.items[0].code,last=g.items[g.items.length-1].code;
  var h='<details class="grp" data-g="'+g.key+'"'+(open?' open':'')+'><summary><span class="gl"><span class="gname">'+esc(g.name)+'</span><span class="grange">'+first+' – '+last+'</span></span><span class="gright">'+groupRight(g,s)+'</span><span class="chev" aria-hidden="true"></span></summary>';
  if(acts) h+='<div class="gacts"><button type="button" class="btn sm" data-act="fillN" data-g="'+g.key+'">Offene auf N setzen</button><button type="button" class="btn sm" data-act="clearG" data-g="'+g.key+'">Gruppe leeren</button></div>';
  items.forEach(function(it){h+=rowHtml(it,s.results[it.code],false)});
  return h+'</details>';
}

    +'<div class="chips" role="group" aria-label="Filter"><button type="button" class="chip" id="chip-all" data-filter="all"></button><button type="button" class="chip" id="chip-open" data-filter="open"></button><button type="button" class="chip" id="chip-flag" data-filter="flag"></button></div>'
    +'<p class="legend"><span><span class="lg lg-n">N</span>normal</span><span><span class="lg lg-p">+</span>positiv</span><span><span class="lg lg-m">−</span>negativ</span><span>+ und − zusammen: bipolar</span></p></div>';

function updateChips(){
  var items=SYSITEMS[sysKey(st.view)]; if(!items) return;
  var a=$('#chip-all'); if(!a) return;
  var s=cur(),open=0,flag=0;
  items.forEach(function(it){var v=s.results[it.code]; if(!v) open++; else if(classify(v)) flag++});
  a.textContent='Alle '+items.length;
  $('#chip-open').textContent='Offen '+open;
  $('#chip-flag').textContent='Auffällig '+flag;
  [['all','#chip-all'],['open','#chip-open'],['flag','#chip-flag']].forEach(function(p){
    $(p[1]).setAttribute('aria-pressed',st.filter===p[0]?'true':'false');
  });
}
function match(it,s,q,f){
  var v=s.results[it.code];
  if(f==='open'&&v) return false;
  if(f==='flag'&&!classify(v)) return false;
  if(q&&it.code.indexOf(q)<0&&it.name.toLowerCase().indexOf(q)<0&&it.gname.toLowerCase().indexOf(q)<0) return false;
  return true;
}
function renderList(){
  var s=cur(),q=st.q.trim().toLowerCase(),f=st.filter,searching=!!q||f!=='all',html='',shown=0;
  GROUPS[sysKey(st.view)].forEach(function(g){
    var items=g.items.filter(function(it){return match(it,s,q,f)});
    if(!items.length) return;
    shown+=items.length;
    html+=groupHtml(g,items,s,searching||st.open[g.key],!searching);
  });
  if(!shown){
    html='<div class="empty"><p>'+(q?'Nichts gefunden für „'+esc(st.q.trim())+'“.':(f==='open'?'Alles in diesem Bereich ist getestet.':'Noch keine auffälligen Einträge in diesem Bereich.'))+'</p>'
      +'<button type="button" class="btn" data-act="clearQ">Suche und Filter zurücksetzen</button></div>';
  }
  $('#list').innerHTML=html;
  updateChips();
}

function buildText(s){
  var t=stats(s),L=[];
  L.push('Bioresonanz Test – '+spName(s));
  L.push(spName(s)+': '+(s.horse||'ohne Namen')+' · '+fmtDate(s.date));
  L.push('Getestet: '+t.done+' von '+itemsOf(s).length+' · positiv (+): '+t.pos+' · negativ (−): '+t.neg+' · bipolar (+ und −): '+t.bip+' · mit N markiert: '+t.n);
  L.push('');
  var arr=flaggedList(s);
  L.push('AUFFÄLLIG (nach Nummer) – '+arr.length);
  if(arr.length) arr.forEach(function(i){var c=classify(s.results[i.code]);L.push(i.code+'  '+i.name+'  ['+SYSNAME[i.sys]+' · '+i.gname+']  '+(c==='b'?'+ und −':c==='p'?'+':'−')+(hasF(s.results[i.code],'N')?' (auch N)':''))});
  else L.push('keine');
  L.push('');
  if(s.note.trim()){L.push('Notiz');L.push(s.note.trim())}
  return L.join('\n').trim();
}
function findingsHtml(s){
  var t=stats(s),h='';
  if(!t.done){
    return '<div class="empty"><p>Noch nichts getestet. Wähle bei jedem Programm N, + oder −.</p><button type="button" class="btn primary" data-act="goPhys">Zum Standard</button></div>';
  }
  var arr=flaggedList(s);
  if(arr.length){
    h+='<h3>Auffällig<span class="cnt">'+arr.length+'</span></h3>';
    h+='<div class="grp">'+arr.map(function(i){return rowHtml(i,s.results[i.code],true)}).join('')+'</div>';
  }
  if(!h) h='<p class="none">Keine auffälligen Einträge. Alle bewerteten Programme sind nur mit N markiert.</p>';

}

function openSession(id){
  if(!st.sessions[id]) return;
  if(id!==st.cur) dropPristine();
  st.cur=id;LS.set('tb-current',id);st.newId=null;st.editing=null;
  st.view='std';st.q='';st.filter='all';st.conf=null;

function removeSession(id){
  clearTimeout(timers[id]);dirty.delete(id);

/* Druckliste: alle auffälligen Programme (+, − oder beides) mit Kästchen N, + und − als PDF.
   Der Seitendruck ist in der App gesperrt, darum wird eine PDF-Datei zum Sichern angeboten. */
function buildPdf(s){
  var J=window.jspdf&&window.jspdf.jsPDF; if(!J) return null;
  var doc=new J({unit:'mm',format:'a4'});
  var M=15,PW=210,PH=297,BOT=PH-18,TW=179,LH=3.65;
  var cw=[17,80,52,10,10,10],cx=[M];
  for(var i=0;i<cw.length;i++) cx.push(cx[i]+cw[i]);
  var t=stats(s),flagged=t.pos+t.neg+t.bip,y=M;
  doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(0);
  doc.text('Bioresonanz Test – '+spName(s),M,y+5);y+=12;
  doc.setFont('helvetica','normal');doc.setFontSize(10.5);
  doc.text(spName(s)+': '+(s.horse||'ohne Namen')+'     Datum: '+fmtDate(s.date),M,y);y+=5.5;
  doc.text('Auffällig: '+flagged+' (positiv '+t.pos+', negativ '+t.neg+', bipolar '+t.bip+')     Getestet: '+t.done+' von '+itemsOf(s).length,M,y);y+=8;
  function head(){
    doc.setFillColor(228,228,228);doc.rect(M,y,TW,6,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(0);
    doc.text('Nr.',cx[0]+1,y+4.2);doc.text('Programm',cx[1]+1,y+4.2);doc.text('Bereich',cx[2]+1,y+4.2);
    doc.text('N',cx[3]+5,y+4.2,{align:'center'});doc.text('+',cx[4]+5,y+4.2,{align:'center'});doc.text('-',cx[5]+5,y+4.2,{align:'center'});
    y+=6;
  }
  var any=false;
  var items=flaggedList(s);
  if(items.length){
    any=true;head();
    items.forEach(function(it){
      var v=s.results[it.code];
      doc.setFont('helvetica','normal');doc.setFontSize(9);
      var a=doc.splitTextToSize(it.name,cw[1]-2),b=doc.splitTextToSize(SYSNAME[it.sys]+' · '+it.gname,cw[2]-2);
      var rh=Math.max(a.length,b.length,1)*LH+3;
      if(y+rh>BOT){doc.addPage();y=M;head()}
      doc.setTextColor(0);
      doc.text(it.code,cx[0]+1,y+4);doc.text(a,cx[1]+1,y+4);doc.text(b,cx[2]+1,y+4);
      [hasF(v,'N'),hasF(v,'+'),hasF(v,'-')].forEach(function(on,k){
        var bx=cx[3+k]+3,by=y+1.3;
        doc.setDrawColor(90);doc.setLineWidth(.2);doc.rect(bx,by,4,4);
        if(on){doc.setLineWidth(.5);doc.setDrawColor(0);doc.line(bx+.8,by+.8,bx+3.2,by+3.2);doc.line(bx+3.2,by+.8,bx+.8,by+3.2)}
      });
      doc.setDrawColor(200);doc.setLineWidth(.15);doc.line(M,y+rh,M+TW,y+rh);
      y+=rh;
    });
  }
  if(!any){doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.text('Keine auffälligen Werte.',M,y+4);y+=8}
  var note=(s.note||'').trim();
  if(note){
    if(y+14>BOT){doc.addPage();y=M}
    y+=3;doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(0);doc.text('Notiz',M,y+4);y+=7;
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);
    doc.splitTextToSize(note,TW).forEach(function(line){
      if(y+5>BOT){doc.addPage();y=M}
      doc.text(line,M,y+3.5);y+=4.6;
    });
  }
  var pages=doc.getNumberOfPages();
  for(var p=1;p<=pages;p++){
    doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(110);
    doc.text((s.horse||spName(s)+' ohne Namen')+' - '+fmtDate(s.date),M,PH-9);
    doc.text('Seite '+p+' / '+pages,PW-M,PH-9,{align:'right'});
  }
  return doc.output('arraybuffer');
}
function printHtml(s){
  var t=stats(s),items=flaggedList(s),h='<h1>Bioresonanz Test \u2013 '+esc(spName(s))+'</h1>'
    +'<p><b>'+esc(spName(s))+':</b> '+esc(s.horse||'ohne Namen')+' &nbsp; <b>Datum:</b> '+esc(fmtDate(s.date))+'</p>'
    +'<p>Auff\u00e4llig: '+items.length+' (positiv '+t.pos+', negativ '+t.neg+', bipolar '+t.bip+') &nbsp; Getestet: '+t.done+' von '+itemsOf(s).length+'</p>';
  if(!items.length) return h+'<p>Keine auff\u00e4lligen Werte.</p>';
  h+='<table><thead><tr><th>Nr.</th><th>Programm</th><th>Bereich</th><th class="c">N</th><th class="c">+</th><th class="c">\u2212</th></tr></thead><tbody>';
  items.forEach(function(it){
    var v=s.results[it.code];
    function bx(x){return '<span class="bx">'+(hasF(v,x)?'X':'')+'</span>'}
    h+='<tr><td>'+it.code+'</td><td>'+esc(it.name)+'</td><td>'+esc(SYSNAME[it.sys]+' \u00b7 '+it.gname)+'</td><td class="c">'+bx('N')+'</td><td class="c">'+bx('+')+'</td><td class="c">'+bx('-')+'</td></tr>';
  });
  h+='</tbody></table>';
  var note=(s.note||'').trim();
  if(note) h+='<p style="margin-top:5mm"><b>Notiz</b><br>'+esc(note).replace(/\n/g,'<br>')+'</p>';
  return h;
}
function printList(){
  var pa=$('#printarea'); if(!pa) return;
  pa.innerHTML=printHtml(cur());
  try{window.print()}catch(e){msg('Drucken ist hier nicht m\u00f6glich.')}
}
async function savePdf(){
  var s=cur(); if(!st.dl){msg('Sichern ist hier nicht möglich. Nutze „Text kopieren“.');return}
  var buf=null;
  try{buf=buildPdf(s)}catch(e){buf=null}
  if(!buf){msg('Die PDF-Erstellung ist hier nicht verfügbar. Nutze „Text kopieren“.');return}
  var name=('Auffaellige_'+(s.horse||spName(s))+'_'+s.date).replace(/[^A-Za-z0-9äöüÄÖÜß_-]+/g,'_')+'.pdf';
  try{await st.dl.save({filename:name,data:buf});msg('PDF gesichert. Öffne die Datei und drucke sie von dort.')}
  catch(e){msg(e&&e.code==='declined'?'Abgebrochen.':'Sichern ist hier nicht möglich. Nutze „Text kopieren“.')}
}
function act(b){
  var a=b.dataset.act,id=b.dataset.id,g=b.dataset.g,s=cur();
  if(a==='fillN'){GBY[g].items.forEach(function(it){if(!s.results[it.code]) s.results[it.code]='N'});touch(s);renderList();refreshAll()}
  else if(a==='clearG'){GBY[g].items.forEach(function(it){delete s.results[it.code]});touch(s);renderList();refreshAll()}
  else if(a==='new') startNew('',b.dataset.sp);
  else if(a==='again') startNew(st.sessions[id]?st.sessions[id].horse:'',st.sessions[id]?spOf(st.sessions[id]):'pferd');
  else if(a==='open') openSession(id);
  else if(a==='del'){st.conf=id;renderSessions()}
  else if(a==='delno'){st.conf=null;renderSessions()}
  else if(a==='edit'){st.editing=id;st.conf=null;renderSessions()}
  else if(a==='edone'){st.editing=null;renderSessions();syncHeader()}
  else if(a==='delyes') removeSession(id);
  else if(a==='copy') copyExp();
  else if(a==='save') saveFile();
  else if(a==='pdf') savePdf();
  else if(a==='print') printList();
  else if(a==='goPhys') setView('std');
  else if(a==='clearQ'){st.q='';st.filter='all';renderMain()}
}

document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.code){
    var s=cur(),c=b.dataset.code,nv=toggleFlag(s.results[c],b.dataset.v);
    if(nv) s.results[c]=nv; else delete s.results[c];
    touch(s);
    if(st.view==='sum') renderFindings();
    else{refreshRow(c);updateGroup(ITEM_BY_CODE[c].gkey)}
    refreshAll();
  }
  else if(b.dataset.esp){
    var s3=st.sessions[st.editing]; if(!s3||spOf(s3)===b.dataset.esp) return;
    s3.species=b.dataset.esp;touch(s3);renderAll();
  }
  else if(b.dataset.species){
    var s2=cur(); if(spOf(s2)===b.dataset.species) return;
    s2.species=b.dataset.species;
    if(!isPristine(s2)) touch(s2);
    renderAll();
  }
  else if(b.dataset.view) setView(b.dataset.view);
  else if(b.dataset.filter){st.filter=b.dataset.filter;renderList()}
  else if(b.dataset.act) act(b);
});
document.addEventListener('input',function(e){
  var t=e.target,s=cur();
  if(t.id==='horse'){s.horse=t.value;touch(s);updateTabs()}
  else if(t.id==='date'){if(t.value){s.date=t.value;touch(s)}}
  else if(t.id==='e-name'){var e1=st.sessions[st.editing];if(e1){e1.horse=t.value;touch(e1);syncHeader()}}
  else if(t.id==='e-date'){var e2=st.sessions[st.editing];if(e2&&t.value){e2.date=t.value;touch(e2);syncHeader()}}
  else if(t.id==='note'){s.note=t.value;touch(s);var x=$('#exp');if(x) x.value=buildText(s)}
  else if(t.id==='q'){st.q=t.value;renderList()}
});
document.addEventListener('toggle',function(e){
  var d=e.target;
  if(d&&d.matches&&d.matches('details[data-g]')) st.open[d.dataset.g]=d.open;
},true);

/* ---------- Start ---------- */
(function(){
  var s=newSession('');st.cur=s.id;
  renderAll();
  init();
})();
})();
</script>
